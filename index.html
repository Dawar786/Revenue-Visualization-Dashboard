<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>visualization.js</title>
    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        .chart-container {
            width: 600px;
            margin: auto;
        }
    </style>
</head>

<body>
<h1>Data Visualization with Chart.js</h1>


    <div class="chart-container">
        <h2>Line Chart</h2>
        <canvas id="linechart"></canvas>
        <h2>Bar Chart</h2>
        <canvas id="barchart"></canvas>
        <h2>Pie Chart</h2>
        <canvas id="piechart"></canvas>
    </div>

    <!-- ✅ Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx1 = document.getElementById('linechart');
        const ctx2 = document.getElementById('barchart');
        const ctx3 = document.getElementById('piechart');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
        const revenue = [50000, 60000, 55000, 70000, 75000, 80000];
        const expenses = [30000, 35000, 32000, 40000, 42000, 45000];
        const profit = [20000, 25000, 23000, 30000, 33000, 35000];

        new Chart(ctx1, {
            type: 'line',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    borderColor: 'blue',
                    fill: false
                },
                {
                    label: 'Expenses',
                    data: expenses,
                    borderColor: 'red',
                    fill: false
                },
                {
                    label: 'Profit',
                    data: profit,
                    borderColor: 'green',
                    fill: false
                }]
            }
        });
        //creating ctx2 for bar chart showing revenue only
        new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Revenue',
                    data: revenue,
                    backgroundColor: 'blue'
                }]
            }
        });
        //ctx3 is going to be a pie chart showing profit distribution for june
        new Chart(ctx3, {
            type: 'pie',
            data: {
                labels: ['Reinvestment', 'Salary', 'Miscellenous'],
                datasets: [{
                    label: 'Profit Distribution for June',
                    data: [40, 35, 25],
                    backgroundColor: ['blue', 'red', 'green']
                }]
            }
        });

    </script>

</body>

</html>
